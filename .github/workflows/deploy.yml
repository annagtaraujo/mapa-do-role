name: Deploy Infrastructure

# Roda apenas manualmente — quando Supabase + Cloudflare estiverem prontos para IaC.
# Por enquanto o Cloudflare Pages deploya automaticamente via integração com GitHub (sem Actions).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite 'sim' para confirmar o apply"
        required: true

jobs:
  tofu-apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'sim' }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.7.x"

      - name: tofu init
        run: tofu init

      - name: tofu apply
        run: tofu apply -auto-approve
        env:
          TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TF_VAR_supabase_organization_id: ${{ secrets.SUPABASE_ORG_ID }}
          TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

  supabase-migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    needs: tofu-apply

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
